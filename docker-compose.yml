version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulseguard-postgres
    restart: always
    environment:
      POSTGRES_DB: pulseguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulseguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulseguard-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulseguard-gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pulseguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_KEY: pg_mon_secret_key_2026
      JWT_SECRET: pg_jwt_secret_key_super_secure_9982
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulseguard-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      fastapi-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
